<?xml version="1.0" standalone="no"?>
<?xml-stylesheet href="picker.css" type="text/css"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="475" height="285" version="1.1" xmlns="http://www.w3.org/2000/svg" onload="init()" xmlns:xlink="http://www.w3.org/1999/xlink">

  <script xlink:href="picker.js" />

  <rect x="0" y="0" width="475" height="285" class="background"/>

  <g transform="translate(7,5)">
    <text x="255" y="10" class="small bold label">Directions:</text>
    <text x="255" y="22" class="small">Click a rating and region in the rose.</text>
    <text x="255" y="32" class="small">Click again to add the &quot;pepperoni.&quot;</text>

    <text x="130" y="15" class="bold" onmousedown="fill_aspect(new Array(0,8,16))">N</text>
    <text x="220" y="50" class="bold" onmousedown="fill_aspect(new Array(1,9,17))">NE</text>
    <text x="255" y="140" class="bold" onmousedown="fill_aspect(new Array(2,10,18))">E</text>
    <text x="220" y="230" class="bold" onmousedown="fill_aspect(new Array(3,11,19))">SE</text>
    <text x="130" y="268" class="bold" onmousedown="fill_aspect(new Array(4,12,20))">S</text>
    <text x="23" y="230" class="bold" onmousedown="fill_aspect(new Array(5,13,21))">SW</text>
    <text x="0" y="140" class="bold" onmousedown="fill_aspect(new Array(6,14,22))">W</text>
    <text x="23" y="50" class="bold" onmousedown="fill_aspect(new Array(7,15,23))">NW</text>

    <rect x="295" y="50" width="25" height="25" class="empty" onmousedown="set_color(0)"/>
    <text x="327" y="67" class="medium bold" onmousedown="set_color(0)">None</text>

    <rect x="295" y="80" width="25" height="25" class="extreme" onmousedown="set_color(5)"/>
    <text x="327" y="97" class="medium bold" onmousedown="set_color(5)">Extreme</text>

    <rect x="295" y="110" width="25" height="25" class="high" onmousedown="set_color(4)"/>
    <text x="327" y="127" class="medium bold" onmousedown="set_color(4)">High</text>

    <rect x="295" y="140" width="25" height="25" class="considerable" onmousedown="set_color(3)"/>
    <text x="327" y="157" class="medium bold" onmousedown="set_color(3)">Considerable</text>

    <rect x="295" y="170" width="25" height="25" class="moderate" onmousedown="set_color(2)"/>
    <text x="327" y="187" class="medium bold" onmousedown="set_color(2)">Moderate</text>

    <rect x="295" y="200" width="25" height="25" class="low" onmousedown="set_color(1)"/>
    <text x="327" y="217" class="medium bold" onmousedown="set_color(1)">Low</text>

    <text x="255" y="250" class="small bold label">Tips:</text>
    <text x="255" y="262" class="small">Click aspect label to select all elevations.</text>
    <text x="255" y="272" class="small">Alt/Option-click to select all aspects.</text>
  </g>

  <g transform="translate(7,5) rotate(23,135,135)">

    <!-- start at top, clockwise, outer ring -->
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="16" onmousedown="fill(evt,16)"/>
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="17" transform="rotate(45,135,135)" onmousedown="fill(evt,17)"/>
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="18" transform="rotate(90,135,135)" onmousedown="fill(evt,18)"/>
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="19" transform="rotate(135,135,135)" onmousedown="fill(evt,19)"/>
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="20" transform="rotate(180,135,135)" onmousedown="fill(evt,20)"/>
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="21" transform="rotate(225,135,135)" onmousedown="fill(evt,21)"/>
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="22" transform="rotate(270,135,135)" onmousedown="fill(evt,22)"/>
    <path d="M135,135 L56,56 A110,110 0 0 1 135,23 Z" fill="#999" id="23" transform="rotate(315,135,135)" onmousedown="fill(evt,23)"/>

    <!-- start at top, clockwise, middle ring -->
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="8" onmousedown="fill(evt,8)"/>
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="9" transform="rotate(45,135,135)" onmousedown="fill(evt,9)"/>
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="10" transform="rotate(90,135,135)" onmousedown="fill(evt,10)"/>
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="11" transform="rotate(135,135,135)" onmousedown="fill(evt,11)"/>
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="12" transform="rotate(180,135,135)" onmousedown="fill(evt,12)"/>
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="13" transform="rotate(225,135,135)" onmousedown="fill(evt,13)"/>
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="14" transform="rotate(270,135,135)" onmousedown="fill(evt,14)"/>
    <path d="M135,135 L74,74 A85,85 0 0 1 135,49 Z" fill="#999" id="15" transform="rotate(315,135,135)" onmousedown="fill(evt,15)"/>

    <!-- start at top, clockwise, inner ring -->
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="0" onmousedown="fill(evt,0)"/>
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="1" transform="rotate(45,135,135)" onmousedown="fill(evt,1)"/>
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="2" transform="rotate(90,135,135)" onmousedown="fill(evt,2)"/>
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="3" transform="rotate(135,135,135)" onmousedown="fill(evt,3)"/>
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="4" transform="rotate(180,135,135)" onmousedown="fill(evt,4)"/>
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="5" transform="rotate(225,135,135)" onmousedown="fill(evt,5)"/>
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="6" transform="rotate(270,135,135)" onmousedown="fill(evt,6)"/>
    <path d="M135,135 L96,96 A55,55 0 0 1 135,80 Z" fill="#999" id="7" transform="rotate(315,135,135)" onmousedown="fill(evt,7)"/>
  </g>

  <g transform="translate(-3,0)">
    <!-- (dots) start at n, clockwise, outer ring -->
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_16" onmousedown="fill(evt,16)"/>
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_17" transform="rotate(45,145,140)" onmousedown="fill(evt,17)"/>
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_18" transform="rotate(90,145,140)" onmousedown="fill(evt,18)"/>
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_19" transform="rotate(135,145,140)" onmousedown="fill(evt,19)"/>
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_20" transform="rotate(180,145,140)" onmousedown="fill(evt,20)"/>
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_21" transform="rotate(225,145,140)" onmousedown="fill(evt,21)"/>
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_22" transform="rotate(270,145,140)" onmousedown="fill(evt,22)"/>
    <circle cx="145" cy="40" r="8" fill="#999" id="dot_23" transform="rotate(315,145,140)" onmousedown="fill(evt,23)"/>

    <!-- (dots) start at n, clockwise, middle ring -->
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_8" onmousedown="fill(evt,8)"/>
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_9" transform="rotate(45,145,140)" onmousedown="fill(evt,9)"/>
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_10" transform="rotate(90,145,140)" onmousedown="fill(evt,10)"/>
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_11" transform="rotate(135,145,140)" onmousedown="fill(evt,11)"/>
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_12" transform="rotate(180,145,140)" onmousedown="fill(evt,12)"/>
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_13" transform="rotate(225,145,140)" onmousedown="fill(evt,13)"/>
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_14" transform="rotate(270,145,140)" onmousedown="fill(evt,14)"/>
    <circle cx="145" cy="70" r="8" fill="#999" id="dot_15" transform="rotate(315,145,140)" onmousedown="fill(evt,15)"/>

    <!-- (dots) start at n, clockwise, inner ring -->
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_0" onmousedown="fill(evt,0)"/>
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_1" transform="rotate(45,145,140)" onmousedown="fill(evt,1)"/>
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_2" transform="rotate(90,145,140)" onmousedown="fill(evt,2)"/>
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_3" transform="rotate(135,145,140)" onmousedown="fill(evt,3)"/>
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_4" transform="rotate(180,145,140)" onmousedown="fill(evt,4)"/>
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_5" transform="rotate(225,145,140)" onmousedown="fill(evt,5)"/>
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_6" transform="rotate(270,145,140)" onmousedown="fill(evt,6)"/>
    <circle cx="145" cy="102" r="8" fill="#999" id="dot_7" transform="rotate(315,145,140)" onmousedown="fill(evt,7)"/>
  </g>

  <circle cx="15" cy="15" r="6" fill="#999" id="active_color"/>
  <text x="26" y="18" class="small">Active</text>
</svg>
